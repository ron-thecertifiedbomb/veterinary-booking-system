# vet.rondev.com.ph — Vet booking app (Expo static web)
# VPS: 89.117.51.237 · upstream: 127.0.0.1:8093
#
# sudo cp veterinary-booking-system/nginx/vet.rondev.com.ph.conf /etc/nginx/sites-available/
# sudo ln -sf /etc/nginx/sites-available/vet.rondev.com.ph.conf /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx
# sudo certbot --nginx -d vet.rondev.com.ph

server {
    listen 80;
    listen [::]:80;
    server_name vet.rondev.com.ph;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8093;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
